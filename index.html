<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fa" />
    <meta
      name="description"
      content="N1 Study：面向 JLPT N1 学习者的日语词汇与语法练习。"
    />
    <title>N1 Study — 日本語能力試験 N1 練習</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <main class="home">
      <header class="brand-row" aria-label="N1 Study">
        <a class="brand" href="./" aria-label="N1 Study 首页">
          <span class="brand-mark" aria-hidden="true">N1</span>
          <span>N1 Study</span>
        </a>
        <div class="header-actions">
          <span class="beta-badge">Beta / 試作版</span>
          <button class="theme-toggle" type="button" data-theme-toggle aria-label="切换到暗色模式" title="切换到暗色模式" aria-pressed="false">
            <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path class="bulb-glass" d="M9 18h6m-5 3h4m-6.1-6.2a7 7 0 1 1 8.2 0c-.9.7-1.3 1.5-1.4 2.2h-5.4c-.1-.7-.5-1.5-1.4-2.2Z" />
              <path class="bulb-ray" d="M12 1v2m8.2 2.8-1.4 1.4M23 12h-2M4.6 5.8 3.2 4.4M3 12H1" />
            </svg>
          </button>
        </div>
      </header>

      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">YOUR DAILY JAPANESE PRACTICE</p>
        <h1 id="page-title">N1 Study</h1>
        <p class="hero-subtitle" lang="ja">日本語能力試験 N1 練習</p>
        <p class="hero-description">
          每天练一点词汇和语法，稳步准备 N1。
        </p>
      </section>

      <section class="practice-section" aria-labelledby="practice-title">
        <h2 id="practice-title">选择练习内容</h2>
        <div class="practice-grid">
          <a class="practice-card vocabulary-card" href="./vocabulary/" aria-label="词汇练习">
            <span class="card-icon" aria-hidden="true">語</span>
            <span class="card-copy">
              <span class="card-title" lang="ja">語彙</span>
              <span class="card-description">读音、词义与用法</span>
            </span>
            <span class="card-arrow" aria-hidden="true">→</span>
          </a>

          <a class="practice-card grammar-card" href="./grammar/" aria-label="语法练习">
            <span class="card-icon" aria-hidden="true">文</span>
            <span class="card-copy">
              <span class="card-title" lang="ja">文法</span>
              <span class="card-description">语法形式与上下文</span>
            </span>
            <span class="card-arrow" aria-hidden="true">→</span>
          </a>
        </div>
      </section>

      <footer class="site-footer">
        <p>题目为原创学习材料，仍在持续检查与完善中。</p>
        <p class="disclaimer">
          N1 Study is an independent study project and is not affiliated with
          or endorsed by the JLPT.
        </p>
      </footer>
    </main>
    <script src="./js/app.js" defer></script>
  </body>
</html>
